<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">

<head>
    <script src="/js/referral.js"></script>
    <!-- Meta Pixel Code -->

            if (f.fbq) return; n = f.fbq = function () {
                n.callMethod ?
                    n.callMethod.apply(n, arguments) : n.queue.push(arguments)
            };
            if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
            n.queue = []; t = b.createElement(e); t.async = !0;
            t.src = v; s = b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t, s)
        }(window, document, 'script',
            'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '4190907814571632');

    <noscript><img height="1" width="1" style="display:none"
            src="https://www.facebook.com/tr?id=4190907814571632&ev=PageView&noscript=1" /></noscript>
    <!-- End Meta Pixel Code -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - AIProdGen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="h-full font-sans text-slate-900 bg-slate-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <!-- Logo -->
        <a href="/index.html" class="inline-flex items-center gap-2.5 mb-6 group">
            <img src="/logo.png" alt="AIProdGen" class="w-10 h-10 rounded-xl shadow-sm border border-slate-200">
            <span class="text-2xl font-bold tracking-tight text-slate-900">
                AI<span class="text-brand-600">ProdGen</span>
            </span>
        </a>
        <h2 id="pageTitle" class="text-2xl font-bold tracking-tight text-slate-900">Welcome back</h2>
        <p id="pageSubtitle" class="mt-2 text-sm text-slate-500">
            Sign in to access your product catalog and marketing studio
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
        <div class="bg-white py-8 px-6 sm:px-10 shadow-sm border border-slate-200/80 rounded-2xl">
            <!-- Mode Switcher Tabs -->
            <div class="flex border-b border-slate-200 mb-6">
                <button id="tabLogin" onclick="switchTab('login')"
                    class="flex-1 pb-3 text-sm font-semibold text-brand-600 border-b-2 border-brand-600 transition-colors">
                    Sign In
                </button>
                <button id="tabSignup" onclick="switchTab('signup')"
                    class="flex-1 pb-3 text-sm font-semibold text-slate-500 hover:text-slate-700 border-b-2 border-transparent transition-colors">
                    Create Account
                </button>
            </div>

            <!-- Error Banner -->
            <div id="errorMessage" class="hidden mb-4 p-3.5 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700 flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 text-red-500"></i>
                <span id="errorText"></span>
            </div>

            <!-- Auth Form -->
            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">Work Email</label>
                    <input type="email" id="email" required autocomplete="email"
                        class="block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 text-sm focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-600/20 transition"
                        placeholder="founder@yourstore.com">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-700">Password</label>
                        <a id="forgotPasswordLink" href="/reset-password.html" class="text-xs font-medium text-brand-600 hover:text-brand-700">
                            Forgot password?
                        </a>
                    </div>
                    <input type="password" id="password" required autocomplete="current-password"
                        class="block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 text-sm focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-600/20 transition"
                        placeholder="••••••••">
                    <p id="passwordHint" class="hidden text-xs text-slate-500 mt-1.5">Must be at least 8 characters</p>
                </div>

                <div class="pt-2">
                    <button type="submit" id="submitBtn"
                        class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-slate-900 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-colors">
                        Sign In
                    </button>
                </div>
            </form>

            <!-- Google Divider -->
            <div class="mt-6 flex items-center gap-4">
                <div class="flex-1 h-px bg-slate-200"></div>
                <span class="text-xs uppercase tracking-wider text-slate-400 font-medium">Or continue with</span>
                <div class="flex-1 h-px bg-slate-200"></div>
            </div>

            <!-- Google Sign-In Container -->
            <div class="mt-6">
                <div id="g_id_onload"
                    data-client_id="374339940232-7it6pb550qn9rfj2lfg5nb0mda6nocof.apps.googleusercontent.com"
                    data-context="signin" data-ux_mode="popup" data-callback="handleGoogleSignIn"
                    data-auto_prompt="false">
                </div>
                <div class="g_id_signin flex justify-center" data-type="standard" data-shape="rectangular" data-theme="outline"
                    data-text="signin_with" data-size="large" data-logo_alignment="left" data-width="100%">
                </div>
            </div>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-500">
                By continuing, you agree to our 
                <a href="/terms.html" class="underline hover:text-slate-800">Terms of Service</a> and 
                <a href="/privacy.html" class="underline hover:text-slate-800">Privacy Policy</a>.
            </div>
        </div>
        
        <p class="text-center mt-6 text-sm text-slate-500">
            Need an e-commerce catalog demo? 
            <a href="/index.html" class="font-semibold text-brand-600 hover:text-brand-700">Explore Capabilities &rarr;</a>
        </p>
    </div>

    <script>
        if (window.lucide) {
            lucide.createIcons();
        }

        // Check if already logged in with valid token
        (async function checkExistingSession() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('/api/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (data.valid) {
                            window.location.href = '/dashboard.html';
                        } else {
                            localStorage.removeItem('token');
                            localStorage.removeItem('userEmail');
                        }
                    }
                } catch (e) {
                    console.error('Session check failed:', e);
                }
            }
        })();

        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            const tabLogin = document.getElementById('tabLogin');
            const tabSignup = document.getElementById('tabSignup');
            const submitBtn = document.getElementById('submitBtn');
            const passwordHint = document.getElementById('passwordHint');
            const forgotPasswordLink = document.getElementById('forgotPasswordLink');
            const pageTitle = document.getElementById('pageTitle');
            const pageSubtitle = document.getElementById('pageSubtitle');

            // Clear errors
            document.getElementById('errorMessage').classList.add('hidden');

            if (mode === 'login') {
                tabLogin.className = 'flex-1 pb-3 text-sm font-semibold text-brand-600 border-b-2 border-brand-600 transition-colors';
                tabSignup.className = 'flex-1 pb-3 text-sm font-semibold text-slate-500 hover:text-slate-700 border-b-2 border-transparent transition-colors';
                submitBtn.textContent = 'Sign In';
                pageTitle.textContent = 'Welcome back';
                pageSubtitle.textContent = 'Sign in to access your product catalog and marketing studio';
                passwordHint.classList.add('hidden');
                forgotPasswordLink.classList.remove('hidden');
            } else {
                tabSignup.className = 'flex-1 pb-3 text-sm font-semibold text-brand-600 border-b-2 border-brand-600 transition-colors';
                tabLogin.className = 'flex-1 pb-3 text-sm font-semibold text-slate-500 hover:text-slate-700 border-b-2 border-transparent transition-colors';
                submitBtn.textContent = 'Create Free Workspace';
                pageTitle.textContent = 'Create your account';
                pageSubtitle.textContent = 'Start with 20 free monthly AI product generations';
                passwordHint.classList.remove('hidden');
                forgotPasswordLink.classList.add('hidden');
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const submitBtn = document.getElementById('submitBtn');

            errorEl.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = currentMode === 'login' ? 'Signing in...' : 'Setting up workspace...';

            const endpoint = currentMode === 'login' ? '/api/auth/login' : '/api/auth/signup';

            try {
                const referralCode = currentMode === 'signup' && window.AIP_REFERRAL ? window.AIP_REFERRAL.code() : null;
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(referralCode ? { email, password, referralCode } : { email, password })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || 'Authentication failed. Please verify your credentials.');
                }

                // Store token and redirect to Workspace
                localStorage.setItem('token', data.token);
                localStorage.setItem('userEmail', data.email);
                window.location.href = '/dashboard.html';

            } catch (error) {
                errorText.textContent = error.message;
                errorEl.classList.remove('hidden');
                if (window.lucide) lucide.createIcons();
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = currentMode === 'login' ? 'Sign In' : 'Create Free Workspace';
            }
        }

        // Google Sign-In Handler
        async function handleGoogleSignIn(response) {
            const errorEl = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorEl.classList.add('hidden');

            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential, referralCode: window.AIP_REFERRAL ? window.AIP_REFERRAL.code() : null })
                });

                const data = await res.json();

                if (data.error) {
                    errorText.textContent = data.error;
                    errorEl.classList.remove('hidden');
                    return;
                }

                // Store token and redirect to Workspace
                localStorage.setItem('token', data.token);
                localStorage.setItem('userEmail', data.email);
                window.location.href = '/dashboard.html';

            } catch (error) {
                errorText.textContent = 'Google sign-in could not complete. Please try again or use email sign in.';
                errorEl.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
