    <title>Admin Login - aiprodgen</title>

    <link rel="stylesheet" href="/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Admin Panel</h1>
            <p class="text-slate-500 text-sm mt-2">Restricted Access</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                <input type="email" id="username"
                    class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                    required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="password"
                    class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                    required>
            </div>
            <button type="submit"
                class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-slate-800 transition-colors">
                Login
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                // Admins authenticate through the normal login route; the admin
                // flag lives on the session, not on a separate shared token.
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok || !data.token) {
                    alert(data.error || 'Login failed');
                    return;
                }

                const check = await fetch('/api/admin/session', {
                    headers: { 'Authorization': `Bearer ${data.token}` }
                });

                if (!check.ok) {
                    alert('That account does not have admin access.');
                    return;
                }

                localStorage.setItem('token', data.token);
                window.location.href = '/admin.html';
            } catch (err) {
                alert('Connection error');
            }
        });
    </script>
</body>

</html>
