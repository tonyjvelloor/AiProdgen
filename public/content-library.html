<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIProdGen - Content Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb',
                        secondary: '#1e40af',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .btn { @apply inline-flex justify-center items-center rounded-md border border-transparent px-4 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-offset-2 transition-colors cursor-pointer; }
            .btn-primary { @apply bg-primary text-white hover:bg-blue-600 focus:ring-primary; }
            .btn-secondary { @apply bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 focus:ring-primary; }
            .card { @apply bg-white shadow-sm rounded-xl border border-gray-200 overflow-hidden; }
            .tab-btn { @apply px-4 py-2 text-sm font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700 hover:border-gray-300 transition-colors focus:outline-none; }
            .tab-btn.active { @apply text-primary border-primary; }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center gap-2">
                        <i data-lucide="layers" class="h-6 w-6 text-primary"></i>
                        <span class="font-bold text-xl tracking-tight text-gray-900">AIProdGen</span>
                    </div>
                    <div class="hidden sm:ml-8 sm:flex sm:space-x-8">
                        <a href="/dashboard.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Workspace</a>
                        <a href="/content-library.html" class="border-primary text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Content Library</a>
                        <a href="/creations.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Legacy Hub</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-900">Content Hub</h1>
            <p class="mt-2 text-sm text-gray-500">All marketing assets generated across your workspace.</p>
        </div>

        <!-- View Toggle Tabs -->
        <div class="border-b border-gray-200 mb-8">
            <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                <button onclick="switchView('collections')" id="tab-collections" class="tab-btn active">By Collection</button>
                <button onclick="switchView('content')" id="tab-content" class="tab-btn">By Content Type</button>
                <button onclick="switchView('product')" id="tab-product" class="tab-btn">By Product</button>
            </nav>
        </div>

        <div id="loadingOutputs" class="flex justify-center py-12">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
        </div>

        <div id="emptyState" class="hidden text-center py-24 bg-white rounded-xl border border-dashed border-gray-300">
            <div class="mx-auto h-12 w-12 text-gray-400 bg-gray-100 rounded-full flex items-center justify-center mb-4">
                <i data-lucide="image" class="h-6 w-6"></i>
            </div>
            <h3 class="text-lg font-medium text-gray-900">No content yet</h3>
            <p class="mt-1 text-sm text-gray-500 mb-6">Go to a Product to generate your first asset.</p>
        </div>

        <!-- Views Container -->
        <div id="viewsContainer" class="hidden space-y-12">
            <!-- Rendered via JS -->
        </div>

    </main>

    <script>
        lucide.createIcons();
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';

        let currentView = 'collections'; // 'collections', 'content', 'product'
        let rawData = []; // This will eventually hold real data from GET /api/workspace/outputs

        function switchView(view) {
            currentView = view;
            
            // Update tabs
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active', 'border-primary', 'text-primary'));
            document.getElementById(`tab-${view}`).classList.add('active', 'border-primary', 'text-primary');

            renderView();
        }

        async function loadContent() {
            try {
                // This shipped with four hardcoded placeholder items -- "Running
                // Shoes", "Coffee Maker" and placehold.co images -- so every
                // user saw the same fake library. Now reads the real workspace.
                const res = await fetch('/api/workspace/outputs', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401) {
                    window.location.href = '/login.html';
                    return;
                }
                if (!res.ok) throw new Error('Failed to load content');

                rawData = await res.json();

                document.getElementById('loadingOutputs').classList.add('hidden');
                
                if (rawData.length === 0) {
                    document.getElementById('emptyState').classList.remove('hidden');
                } else {
                    document.getElementById('viewsContainer').classList.remove('hidden');
                    renderView();
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderView() {
            const container = document.getElementById('viewsContainer');
            container.innerHTML = '';

            const params = new URLSearchParams(window.location.search);
            const productFilter = params.get('product');
            const jobFilter = params.get('job');

            const filteredData = rawData.filter(item => {
                if (productFilter && String(item.product_id) !== String(productFilter)) return false;
                if (jobFilter && item.engine !== jobFilter && !(jobFilter === 'campaign_blueprint' && item.engine === 'blueprint')) return false;
                return true;
            });

            if (productFilter || jobFilter) {
                container.insertAdjacentHTML('beforeend', `
                    <div class="flex items-center justify-between bg-blue-50 border border-blue-200 rounded-lg px-4 py-2.5 text-xs text-blue-800">
                        <span>Showing filtered workspace assets ${jobFilter ? `for <strong>${jobFilter.replace(/_/g, ' ')}</strong>` : ''} (${filteredData.length} item${filteredData.length === 1 ? '' : 's'})</span>
                        <a href="/content-library.html" class="font-bold underline hover:text-blue-900">Show All Assets &rarr;</a>
                    </div>
                `);
            }

            if (filteredData.length === 0) {
                container.insertAdjacentHTML('beforeend', `
                    <div class="text-center py-12 bg-white rounded-xl border border-dashed border-gray-300 text-sm text-gray-500">
                        No assets match this filter yet. <a href="/content-library.html" class="text-primary font-semibold underline ml-1">View all workspace assets</a>
                    </div>
                `);
                return;
            }

            // Group data based on selected view
            const grouped = {};
            
            filteredData.forEach(item => {
                const colLabel = item.collection_name || (item.engine ? item.engine.replace(/_/g, ' ') : 'Studio Output');
                let key = '';
                if (currentView === 'collections') {
                    key = `${item.product_name || 'Product'} — ${colLabel}`;
                } else if (currentView === 'content') {
                    key = (item.engine || 'studio').replace(/_/g, ' ').toUpperCase();
                } else if (currentView === 'product') {
                    key = item.product_name || 'Untitled Product';
                }

                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(item);
            });

            // Render groups
            for (const [groupName, items] of Object.entries(grouped)) {
                
                let gridHtml = items.map(item => {
                    if (item.type === 'copy' || item.type === 'blueprint_json' || (!item.storage_path && item.metadata && item.metadata.content)) {
                        const textContent = (item.metadata && item.metadata.content) ? item.metadata.content : '';
                        return `
                            <div class="card flex flex-col justify-between p-4 bg-white border border-gray-200 aspect-square overflow-hidden">
                                <div class="overflow-y-auto pr-1 flex-grow">
                                    <div class="flex items-center justify-between gap-2 mb-2">
                                        <span class="text-[11px] font-bold uppercase tracking-wider text-primary bg-blue-50 px-2 py-0.5 rounded">${item.format || item.type || 'Copy'}</span>
                                        <i data-lucide="file-text" class="w-3.5 h-3.5 text-gray-400 flex-shrink-0"></i>
                                    </div>
                                    <p class="text-xs text-gray-700 whitespace-pre-wrap leading-relaxed">${textContent.replace(/</g, '&lt;')}</p>
                                </div>
                                <div class="pt-3 mt-2 border-t border-gray-100 flex items-center justify-between">
                                    <span class="text-[11px] text-gray-400 truncate">${item.product_name || ''}</span>
                                    <button onclick="copyHubText(this)" data-copy="${encodeURIComponent(textContent)}" class="text-xs font-semibold text-primary hover:text-blue-700 flex items-center gap-1">
                                        <i data-lucide="copy" class="w-3 h-3"></i> Copy
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                    return `
                        <div class="card relative group aspect-square bg-gray-100 overflow-hidden">
                            <img src="${item.storage_path}" alt="${item.format || 'Generated asset'}" class="w-full h-full object-cover transition-transform group-hover:scale-105">
                            <div class="absolute bottom-2 left-2 bg-black/60 backdrop-blur-sm text-white text-[10px] font-medium px-2 py-0.5 rounded">
                                ${item.format || item.engine || 'Visual'}
                            </div>
                            <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-40 transition-opacity flex items-center justify-center gap-2 opacity-0 group-hover:opacity-100">
                                <a href="${item.storage_path}" download="${(item.format || 'asset').replace(/\s+/g, '_')}.png" target="_blank" class="btn btn-secondary shadow text-xs">
                                    <i data-lucide="download" class="w-3.5 h-3.5 mr-1.5"></i>Download
                                </a>
                                <a href="/asset.html?url=${encodeURIComponent(item.storage_path)}" class="btn btn-primary shadow text-xs">
                                    Inspect
                                </a>
                            </div>
                        </div>
                    `;
                }).join('');

                const section = `
                    <section>
                        <h2 class="text-xl font-bold text-gray-900 mb-4 pb-2 border-b border-gray-200">${groupName}</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
                            ${gridHtml}
                        </div>
                    </section>
                `;
                container.insertAdjacentHTML('beforeend', section);
            }
            
            lucide.createIcons();
        }

        function copyHubText(btn) {
            const text = decodeURIComponent(btn.getAttribute('data-copy') || '');
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.innerHTML;
                btn.innerHTML = '<i data-lucide="check" class="w-3 h-3"></i> Copied!';
                lucide.createIcons();
                setTimeout(() => { btn.innerHTML = orig; lucide.createIcons(); }, 1800);
            });
        }
        
        loadContent();
    </script>
</body>
</html>
