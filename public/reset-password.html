<html lang="en">

<head>

    <title>Reset Password - aiprodgen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="/index.html" class="inline-flex items-center gap-2">
                <div class="w-12 h-12 gradient-bg rounded-xl flex items-center justify-center">
                    <span class="text-white font-bold text-xl">AI</span>
                </div>
                <span class="font-bold text-2xl flex items-center">
                    <span
                        class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 animate-gradient">Ai</span><span
                        class="text-gray-900 dark:text-white">prodgen</span>
                </span>
            </a>
        </div>

        <!-- Request Reset Form (shown initially if no token) -->
        <div id="requestResetCard" class="bg-white rounded-2xl shadow-xl p-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Forgot Password?</h1>
            <p class="text-muted mb-6">Enter your email and we'll send you a reset link.</p>

            <form id="requestResetForm" onsubmit="handleRequestReset(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="resetEmail" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        placeholder="your@email.com">
                </div>
                <div id="requestMessage" class="hidden mb-4 p-3 rounded-lg text-sm"></div>
                <button type="submit" id="requestBtn"
                    class="w-full gradient-bg text-white py-3 rounded-lg font-bold text-lg hover:opacity-90 transition-opacity">
                    Send Reset Link
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="/login.html" class="text-indigo-600 font-medium hover:text-indigo-700">← Back to Login</a>
            </div>
        </div>

        <!-- Reset Password Form (shown when token is present) -->
        <div id="resetPasswordCard" class="hidden bg-white rounded-2xl shadow-xl p-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Create New Password</h1>
            <p class="text-muted mb-6">Enter your new password below.</p>

            <form id="resetPasswordForm" onsubmit="handleResetPassword(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
                    <input type="password" id="newPassword" required minlength="8"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        placeholder="Min 8 characters">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                    <input type="password" id="confirmPassword" required minlength="8"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        placeholder="Confirm password">
                </div>
                <div id="resetMessage" class="hidden mb-4 p-3 rounded-lg text-sm"></div>
                <button type="submit" id="resetBtn"
                    class="w-full gradient-bg text-white py-3 rounded-lg font-bold text-lg hover:opacity-90 transition-opacity">
                    Reset Password
                </button>
            </form>
        </div>

        <!-- Success Card -->
        <div id="successCard" class="hidden bg-white rounded-2xl shadow-xl p-8 text-center">
            <div class="w-16 h-16 gradient-bg rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Password Reset!</h2>
            <p class="text-muted mb-6">Your password has been successfully updated.</p>
            <a href="/login.html" class="inline-block gradient-bg text-white px-8 py-3 rounded-lg font-bold">
                Login Now
            </a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // If token is present, show reset password form
        if (token) {
            document.getElementById('requestResetCard').classList.add('hidden');
            document.getElementById('resetPasswordCard').classList.remove('hidden');
        }

        async function handleRequestReset(e) {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value;
            const messageEl = document.getElementById('requestMessage');
            const btn = document.getElementById('requestBtn');

            messageEl.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                messageEl.className = 'mb-4 p-3 rounded-lg text-sm bg-green-100 border border-green-300 text-green-700';
                messageEl.textContent = data.message || 'Reset link sent! Check your email.';
                messageEl.classList.remove('hidden');

            } catch (error) {
                messageEl.className = 'mb-4 p-3 rounded-lg text-sm bg-red-100 border border-red-300 text-red-700';
                messageEl.textContent = 'Something went wrong. Please try again.';
                messageEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
            }
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageEl = document.getElementById('resetMessage');
            const btn = document.getElementById('resetBtn');

            messageEl.classList.add('hidden');

            if (newPassword !== confirmPassword) {
                messageEl.className = 'mb-4 p-3 rounded-lg text-sm bg-red-100 border border-red-300 text-red-700';
                messageEl.textContent = 'Passwords do not match';
                messageEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting...';

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                // Show success card
                document.getElementById('resetPasswordCard').classList.add('hidden');
                document.getElementById('successCard').classList.remove('hidden');

            } catch (error) {
                messageEl.className = 'mb-4 p-3 rounded-lg text-sm bg-red-100 border border-red-300 text-red-700';
                messageEl.textContent = error.message || 'Failed to reset password';
                messageEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        }
    </script>
</body>

</html>
