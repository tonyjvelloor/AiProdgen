<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - aiprodgen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .modal {
            display: none;
        }

        .modal.active {
            display: flex;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto space-y-8">
        <!-- Header -->
        <header
            class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm">
            <h1 class="text-2xl font-bold text-slate-900">Admin Dashboard</h1>
            <div class="flex items-center gap-4 flex-wrap">
                <button onclick="showAddUserModal()"
                    class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium text-sm hover:bg-indigo-700 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                    </svg>
                    Add User
                </button>
                <button onclick="createTestUser()" class="text-indigo-600 font-medium text-sm hover:underline">
                    + Seed Test User
                </button>
                <button onclick="logout()" class="text-red-600 font-medium text-sm hover:underline">
                    Logout
                </button>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6" id="statsGrid">
            <div class="bg-white p-6 rounded-2xl shadow-sm animate-pulse h-32"></div>
            <div class="bg-white p-6 rounded-2xl shadow-sm animate-pulse h-32"></div>
            <div class="bg-white p-6 rounded-2xl shadow-sm animate-pulse h-32"></div>
            <div class="bg-white p-6 rounded-2xl shadow-sm animate-pulse h-32"></div>
        </div>

        <!-- Users Table -->
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <div
                class="p-6 border-b border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <h2 class="text-lg font-bold text-slate-900">Users</h2>
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <div class="relative flex-1 md:flex-none">
                        <input type="text" id="searchInput" placeholder="Search by email..."
                            class="w-full md:w-64 pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                            oninput="filterUsers()">
                        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <select id="statusFilter" class="px-3 py-2 border border-slate-300 rounded-lg text-sm"
                        onchange="filterUsers()">
                        <option value="all">All Status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 text-slate-700 uppercase tracking-wider font-bold text-xs">
                        <tr>
                            <th class="px-6 py-4">ID</th>
                            <th class="px-6 py-4">Email</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4">Joined</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100" id="usersTable">
                        <tr>
                            <td colspan="5" class="px-6 py-8 text-center text-slate-400">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add User Modal -->
    <div id="addUserModal" class="modal fixed inset-0 bg-black/50 items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md mx-4 shadow-xl">
            <h3 class="text-xl font-bold text-slate-900 mb-4">Add New User</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email *</label>
                    <input type="email" id="newUserEmail" placeholder="user@example.com"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password *</label>
                    <input type="text" id="newUserPassword" placeholder="Enter password"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="newUserActive" checked
                        class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                    <label for="newUserActive" class="text-sm text-slate-700">Active account</label>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="hideAddUserModal()"
                    class="flex-1 px-4 py-2 border border-slate-300 rounded-lg font-medium text-slate-700 hover:bg-slate-50">Cancel</button>
                <button onclick="addNewUser()"
                    class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700">Add
                    User</button>
            </div>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div id="editUserModal" class="modal fixed inset-0 bg-black/50 items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md mx-4 shadow-xl">
            <h3 class="text-xl font-bold text-slate-900 mb-4">Edit User <span id="editUserId"></span></h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input type="email" id="editEmail"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">New Password (leave blank to keep
                        current)</label>
                    <input type="text" id="editPassword" placeholder="Enter new password"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="editActive"
                        class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                    <label for="editActive" class="text-sm text-slate-700">Active account</label>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="hideEditUserModal()"
                    class="flex-1 px-4 py-2 border border-slate-300 rounded-lg font-medium text-slate-700 hover:bg-slate-50">Cancel</button>
                <button onclick="saveUserEdit()"
                    class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700">Save
                    Changes</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = '/admin-login.html';

        let allUsers = [];
        let currentEditId = null;

        async function loadData() {
            try {
                // Load Stats
                const statsRes = await fetch('/api/admin/stats', { headers: { 'x-admin-token': token } });
                const stats = await statsRes.json();

                if (stats.error) {
                    if (stats.error.includes('Unauthorized')) logout();
                    return;
                }

                document.getElementById('statsGrid').innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-indigo-500">
                        <p class="text-slate-500 text-sm font-medium uppercase tracking-wide">Total Revenue</p>
                        <p class="text-3xl font-bold text-slate-900 mt-1">₹${(stats.revenue * 83).toLocaleString()}</p>
                        <p class="text-xs text-slate-400 mt-2">Est. based on user count</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-blue-500">
                        <p class="text-slate-500 text-sm font-medium uppercase tracking-wide">Total Users</p>
                        <p class="text-3xl font-bold text-slate-900 mt-1">${stats.userCount}</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-purple-500">
                        <p class="text-slate-500 text-sm font-medium uppercase tracking-wide">Generations</p>
                        <p class="text-3xl font-bold text-slate-900 mt-1">${stats.totalGenerations}</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-green-500">
                        <p class="text-slate-500 text-sm font-medium uppercase tracking-wide">Images Created</p>
                        <p class="text-3xl font-bold text-slate-900 mt-1">${stats.totalImages}</p>
                    </div>
                `;

                // Load Users
                const usersRes = await fetch('/api/admin/users', { headers: { 'x-admin-token': token } });
                allUsers = await usersRes.json();
                renderUsers(allUsers);

            } catch (err) {
                console.error(err);
                alert('Error loading dashboard data');
            }
        }

        function renderUsers(users) {
            const tableHtml = users.map(user => `
                <tr class="hover:bg-slate-50">
                    <td class="px-6 py-4 text-slate-400 font-mono">#${user.id}</td>
                    <td class="px-6 py-4 font-medium text-slate-900">${user.email}</td>
                    <td class="px-6 py-4">
                        <button onclick="toggleUserStatus(${user.id}, ${user.is_active})" 
                            class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium cursor-pointer transition-colors ${user.is_active ? 'bg-green-100 text-green-800 hover:bg-green-200' : 'bg-red-100 text-red-800 hover:bg-red-200'}">
                            ${user.is_active ? '✓ Active' : '✗ Inactive'}
                        </button>
                    </td>
                    <td class="px-6 py-4 text-slate-500">${new Date(user.created_at).toLocaleDateString()}</td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex items-center justify-end gap-2">
                            <button onclick="showEditUserModal(${user.id}, '${user.email}', ${user.is_active})" 
                                class="text-indigo-600 hover:text-indigo-900 text-sm font-medium px-2 py-1 rounded hover:bg-indigo-50">
                                Edit
                            </button>
                            <button onclick="resetPassword(${user.id}, '${user.email}')" 
                                class="text-amber-600 hover:text-amber-900 text-sm font-medium px-2 py-1 rounded hover:bg-amber-50">
                                Reset Pwd
                            </button>
                            <button onclick="deleteUser(${user.id})" 
                                class="text-red-600 hover:text-red-900 text-sm font-medium px-2 py-1 rounded hover:bg-red-50">
                                Delete
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');

            document.getElementById('usersTable').innerHTML = tableHtml || '<tr><td colspan="5" class="px-6 py-8 text-center text-slate-400">No users found</td></tr>';
        }

        function filterUsers() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;

            let filtered = allUsers;

            if (search) {
                filtered = filtered.filter(u => u.email.toLowerCase().includes(search));
            }

            if (status !== 'all') {
                filtered = filtered.filter(u => status === 'active' ? u.is_active : !u.is_active);
            }

            renderUsers(filtered);
        }

        // Add User Modal
        function showAddUserModal() {
            document.getElementById('newUserEmail').value = '';
            document.getElementById('newUserPassword').value = '';
            document.getElementById('newUserActive').checked = true;
            document.getElementById('addUserModal').classList.add('active');
        }

        function hideAddUserModal() {
            document.getElementById('addUserModal').classList.remove('active');
        }

        async function addNewUser() {
            const email = document.getElementById('newUserEmail').value.trim();
            const password = document.getElementById('newUserPassword').value.trim();
            const is_active = document.getElementById('newUserActive').checked;

            if (!email || !password) {
                alert('Email and password are required');
                return;
            }

            try {
                const res = await fetch('/api/admin/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-token': token
                    },
                    body: JSON.stringify({ email, password, is_active })
                });

                const data = await res.json();
                if (res.ok) {
                    alert('User created successfully!');
                    hideAddUserModal();
                    loadData();
                } else {
                    alert(data.error || 'Failed to create user');
                }
            } catch (e) {
                alert('Error creating user');
            }
        }

        // Edit User Modal
        function showEditUserModal(id, email, isActive) {
            currentEditId = id;
            document.getElementById('editUserId').textContent = '#' + id;
            document.getElementById('editEmail').value = email;
            document.getElementById('editPassword').value = '';
            document.getElementById('editActive').checked = isActive;
            document.getElementById('editUserModal').classList.add('active');
        }

        function hideEditUserModal() {
            document.getElementById('editUserModal').classList.remove('active');
            currentEditId = null;
        }

        async function saveUserEdit() {
            if (!currentEditId) return;

            const email = document.getElementById('editEmail').value.trim();
            const password = document.getElementById('editPassword').value.trim();
            const is_active = document.getElementById('editActive').checked;

            const updates = { is_active };
            if (email) updates.email = email;
            if (password) updates.password = password;

            try {
                const res = await fetch(`/api/admin/users/${currentEditId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-token': token
                    },
                    body: JSON.stringify(updates)
                });

                if (res.ok) {
                    alert('User updated successfully!');
                    hideEditUserModal();
                    loadData();
                } else {
                    const data = await res.json();
                    alert(data.error || 'Update failed');
                }
            } catch (e) {
                alert('Error updating user');
            }
        }

        async function toggleUserStatus(id, currentStatus) {
            try {
                const res = await fetch(`/api/admin/users/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-token': token
                    },
                    body: JSON.stringify({ is_active: !currentStatus })
                });

                if (res.ok) {
                    loadData();
                } else {
                    const data = await res.json();
                    alert(data.error || 'Failed to update status');
                }
            } catch (e) {
                alert('Error updating status');
            }
        }

        async function resetPassword(id, email) {
            const newPassword = prompt(`Enter new password for ${email}:`);
            if (!newPassword) return;

            try {
                const res = await fetch(`/api/admin/users/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-token': token
                    },
                    body: JSON.stringify({ password: newPassword })
                });

                if (res.ok) {
                    alert(`Password reset successfully!\n\nEmail: ${email}\nNew Password: ${newPassword}`);
                } else {
                    const data = await res.json();
                    alert(data.error || 'Failed to reset password');
                }
            } catch (e) {
                alert('Error resetting password');
            }
        }

        async function deleteUser(id) {
            if (!confirm(`Are you sure you want to delete user #${id}?\n\nThis will also delete all their generations and data. This cannot be undone.`)) return;

            try {
                const res = await fetch(`/api/admin/users/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-admin-token': token }
                });

                if (res.ok) {
                    alert('User deleted successfully');
                    loadData();
                } else {
                    const data = await res.json();
                    alert(data.error || 'Delete failed');
                }
            } catch (e) {
                alert('Error deleting user');
            }
        }

        async function createTestUser() {
            try {
                const res = await fetch('/api/test/seed', { method: 'POST' });
                const data = await res.json();
                alert(data.message);
                loadData();
            } catch (e) {
                alert('Error seeding user');
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = '/admin-login.html';
        }

        loadData();
    </script>
</body>

</html>
