<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Wall — Aiprodgen</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/index.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .masonry-grid {
            column-count: 1;
            column-gap: 16px;
        }

        @media (min-width: 640px) {
            .masonry-grid {
                column-count: 2;
            }
        }

        @media (min-width: 768px) {
            .masonry-grid {
                column-count: 3;
            }
        }

        @media (min-width: 1024px) {
            .masonry-grid {
                column-count: 4;
            }
        }

        .wall-item {
            break-inside: avoid;
            margin-bottom: 16px;
            position: relative;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }

        .wall-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            border-color: #6366f1;
        }

        .wall-media {
            width: 100%;
            display: block;
        }

        .wall-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.9), transparent);
            padding: 20px 12px 12px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .wall-item:hover .wall-overlay {
            opacity: 1;
        }

        .wall-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }

        .like-btn {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            cursor: pointer;
        }

        .like-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .like-btn.liked {
            background: #ef4444;
            color: white;
        }
    </style>
</head>

<body>
    <nav class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-700">
        <div class="container">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <a href="/" class="flex items-center gap-2">
                        <img src="/logo.png" alt="Logo" class="w-8 h-8 rounded-lg">
                        <span class="font-bold text-xl text-white tracking-tight">Aiprodgen <span
                                class="text-violet-400">Community</span></span>
                    </a>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/ugc.html"
                        class="px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-700 text-white text-sm font-semibold transition-colors">
                        Create Your Own 🚀
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-4">
                Made with <span
                    class="bg-clip-text text-transparent bg-gradient-to-r from-violet-400 to-fuchsia-400">Aiprodgen</span>
            </h1>
            <p class="text-lg text-slate-400 max-w-2xl mx-auto">
                Explore thousands of product photos and videos generated by our community using AI.
            </p>
        </header>

        <div id="wallGrid" class="masonry-grid min-h-[500px]">
            <!-- Loading State -->
            <div class="col-span-full text-center py-20">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-white"></div>
                <p class="mt-4 text-slate-500">Loading community creations...</p>
            </div>
        </div>
    </main>

    <script>
        async function loadWall() {
            const grid = document.getElementById('wallGrid');
            try {
                // In a real app we would call an API, but for now we'll fetch from our new public gallery endpoint
                // We'll assume the public endpoint doesn't require auth for viewing GET requests?
                // Actually our middleware usually requires auth. For a public wall, we should allow public access.
                // I need to update server.js to allow public access to /api/ugc/gallery/public

                // For now, let's try to fetch. If 401, we show a "Login to view" or handle it.
                // But wait, the public wall should be public!

                const res = await fetch('/api/ugc/gallery/public');
                if (!res.ok) throw new Error('Failed to load');

                const data = await res.json();
                if (!data.assets || data.assets.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center py-20 text-slate-500">No public posts yet. Be the first!</div>';
                    return;
                }

                grid.innerHTML = '';
                data.assets.forEach(asset => {
                    const item = document.createElement('div');
                    item.className = 'wall-item';

                    const media = asset.type === 'video'
                        ? `<video src="${asset.url}" class="wall-media" loop muted onmouseover="this.play()" onmouseout="this.pause()"></video>`
                        : `<img src="${asset.url}" class="wall-media" loading="lazy">`;

                    item.innerHTML = `
                        ${media}
                        <div class="wall-badge text-white ${asset.type === 'video' ? 'bg-red-500' : 'bg-blue-500'}">${asset.type}</div>
                        <div class="wall-overlay">
                            <p class="text-xs text-white/90 line-clamp-2 mb-2">${asset.prompt || 'Untitled creation'}</p>
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                     <div class="w-5 h-5 rounded-full bg-slate-600 flex items-center justify-center text-[10px] text-white">
                                        ${asset.email ? asset.email[0].toUpperCase() : 'U'}
                                     </div>
                                     <span class="text-xs text-slate-300 truncate max-w-[80px]">${asset.email ? asset.email.split('@')[0] : 'User'}</span>
                                </div>
                                <button class="btn btn-primary" onclick="toggleLike(this, ${asset.id})">
                                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(item);
                });

            } catch (e) {
                console.error(e);
                // Fallback / Mock data for demo if API fails or empty
                grid.innerHTML = '<div class="col-span-full text-center py-20 text-slate-500">Failed to load public gallery. Please try again later.</div>';
            }
        }

        function toggleLike(btn, id) {
            btn.classList.toggle('liked');
            // Optimistic UI interaction
        }

        loadWall();
    </script>
</body>

</html>
