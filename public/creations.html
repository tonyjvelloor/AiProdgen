<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIProdGen - My Creations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb',
                        secondary: '#1e40af',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-gray-900 flex items-center gap-2">
                        <i data-lucide="sparkles" class="text-primary w-5 h-5"></i>
                        AIProdGen
                    </a>
                </div>
                <div class="flex items-center space-x-6">
                    <div class="text-sm font-medium bg-blue-50 text-blue-700 px-3 py-1 rounded-full flex items-center gap-1.5">
                        <i data-lucide="coins" class="w-4 h-4"></i>
                        <span id="creditBalance">0</span> Credits
                    </div>
                    <a href="/dashboard.html" class="bg-primary text-white hover:bg-blue-600 px-4 py-2 rounded-md text-sm font-medium transition-colors">
                        New Campaign
                    </a>
                    <button onclick="logout()" class="text-gray-500 hover:text-gray-900 text-sm transition-colors">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">My Creations</h1>
        </div>

        <!-- Success Toast -->
        <div id="successToast" class="hidden mb-6 bg-green-50 border border-green-200 p-4 rounded-lg flex items-start gap-3">
            <i data-lucide="check-circle" class="text-green-600 w-5 h-5 mt-0.5"></i>
            <div>
                <h3 class="text-sm font-medium text-green-900">Generation Complete</h3>
                <p class="text-sm text-green-700 mt-1">Your new marketing asset has been successfully generated.</p>
            </div>
            <button onclick="document.getElementById('successToast').classList.add('hidden')" class="ml-auto text-green-500 hover:text-green-700">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Gallery -->
        <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Loading state -->
            <div class="col-span-full text-center py-12 text-gray-500 hidden" id="loadingState">
                <i data-lucide="loader-2" class="w-8 h-8 mx-auto animate-spin mb-4 text-primary"></i>
                <p>Loading your creations...</p>
            </div>
            
            <!-- Empty state -->
            <div class="col-span-full text-center py-16 hidden" id="emptyState">
                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="image" class="w-8 h-8 text-gray-400"></i>
                </div>
                <h3 class="text-lg font-medium text-gray-900 mb-1">No creations yet</h3>
                <p class="text-gray-500 mb-6">Start a new campaign to generate your first asset.</p>
                <a href="/dashboard.html" class="inline-flex justify-center items-center rounded-md border border-transparent px-4 py-2 text-sm font-medium text-white bg-primary hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                    Start Campaign
                </a>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login.html';
                return;
            }
            
            // Check for success param
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('success') === 'true') {
                document.getElementById('successToast').classList.remove('hidden');
                
                // If a URL was passed, we can add it to the gallery manually to simulate instant feedback
                const newUrl = urlParams.get('url');
                if (newUrl) {
                    // For the sake of the mock, we just inject it.
                    // In a real app, we'd fetch the history from the DB.
                    renderMockGallery(newUrl);
                }
            } else {
                renderMockGallery();
            }
            
            // Fetch credits
            try {
                const res = await fetch('/api/user/credits', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('creditBalance').innerText = data.credits;
                }
            } catch (e) {
                console.error(e);
            }
        });

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }

        // Simulating DB fetch for now
        function renderMockGallery(newImageUrl = null) {
            const gallery = document.getElementById('gallery');
            const emptyState = document.getElementById('emptyState');
            
            const items = [];
            if (newImageUrl) {
                items.push({
                    url: newImageUrl,
                    preset: 'Minimal Studio Podium',
                    category: 'Skincare',
                    date: 'Just now'
                });
            }
            
            if (items.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                items.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden group hover:shadow-md transition-shadow cursor-pointer';
                    el.onclick = () => window.location.href = '/asset.html?url=' + encodeURIComponent(item.url);
                    el.innerHTML = `
                        <div class="aspect-square bg-gray-100 relative overflow-hidden">
                            <img src="${item.url}" class="w-full h-full object-cover transition-transform group-hover:scale-105">
                            <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 transition-opacity flex items-center justify-center opacity-0 group-hover:opacity-100">
                                <button class="bg-white text-gray-900 rounded-full p-2 shadow-lg hover:scale-110 transition-transform" onclick="event.stopPropagation(); window.location.href='/asset.html?url=${encodeURIComponent(item.url)}'">
                                    <i data-lucide="maximize-2" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                        <div class="p-4">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-xs font-medium bg-blue-50 text-blue-700 px-2 py-1 rounded">${item.category}</span>
                                <span class="text-xs text-gray-400">${item.date}</span>
                            </div>
                            <h3 class="text-sm font-medium text-gray-900 truncate">${item.preset}</h3>
                        </div>
                    `;
                    gallery.appendChild(el);
                });
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
